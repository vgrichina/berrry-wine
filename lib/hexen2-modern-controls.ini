// First-launch defaults; Hexen II writes later in-game changes back over this
// c:\data1\config.cfg, and the shell restores that saved copy next time.
// Hexen.rc runs default.cfg (the 1997 arrows/,./ layout) first, so keys not
// rebound here keep their original meaning. The engine has no mouse-wheel key.
bind w "+forward"
bind s "+back"
bind a "+moveleft"
bind d "+moveright"
bind SPACE "+jump"
bind MOUSE2 "+jump"
bind c "+crouch"
bind CTRL "+crouch"
bind SHIFT "+speed"
bind MOUSE1 "+attack"
bind e "invuse"
bind q "invleft"
bind r "impulse 10"
bind f "impulse 12"
// Always run: what the Options menu's run toggle writes.
cl_forwardspeed "400"
cl_backspeed "400"
lookspring "0"
lookstrafe "0"
m_filter "0"
crosshair "1"
