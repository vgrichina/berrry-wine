// First-launch defaults, mounted as c:\Base\config.cfg. Heretic II writes
// in-game changes to c:\user\config.cfg, which it searches before Base, and
// the shell restores that saved copy next time.
// quake2.dll execs default.cfg (the 1998 arrows/,./ layout) and then this
// file (code at 0x10015a06), so keys not rebound here keep their original
// meaning: 1-9 weapons and spells, [ ] Enter defensive spells, Tab look
// around, Backspace score, T teleport, Y shield. Every command below is one
// default.cfg already binds.
bind w "+forward"
bind s "+back"
bind a "+moveleft"
bind d "+moveright"
bind Space "+moveup"
bind c "+movedown"
bind Ctrl "+movedown"
bind Shift "+speed"
bind e "+action"
bind Mouse1 "+attack"
bind Mouse2 "+defend"
bind f "+defend"
bind q "defnext"
bind r "weapnext"
bind MWheelUp "weapprev"
bind MWheelDown "weapnext"
// Always run (Shift walks), mouse look, a crosshair to aim the staff/spells by.
set cl_run "1"
set freelook "1"
set lookspring "0"
set lookstrafe "0"
set m_filter "0"
set mouse_sensitivity_x "4"
set mouse_sensitivity_y "4"
set crosshair "1"
