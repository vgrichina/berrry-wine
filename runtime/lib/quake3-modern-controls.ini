// First-launch defaults; later in-game changes are restored from saved q3config.cfg.
bind w "+forward"
bind s "+back"
bind a "+moveleft"
bind d "+moveright"
bind SPACE "+moveup"
bind CTRL "+movedown"
bind c "+movedown"
bind SHIFT "+speed"
bind MOUSE1 "+attack"
bind MOUSE2 "+moveup"
bind MWHEELUP "weapprev"
bind MWHEELDOWN "weapnext"
bind [ "weapprev"
bind ] "weapnext"
bind ENTER "+button2"
bind e "+button2"
seta cl_run "1"
seta cl_freelook "1"
seta m_filter "0"
seta sensitivity "3"
